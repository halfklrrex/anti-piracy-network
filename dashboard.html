<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Her Imperial Majesty’s Anti-Piracy Network</title>
<link rel="icon" href="/emblem">
<style>
  /* Saira (SIL OFL, fonts/OFL.txt), served by stacker.py from fonts/ so the page
     never goes online. Without the file everything falls back to the system sans. */
  @font-face {
    font-family: "Saira"; font-style: normal; font-weight: 100 900; font-display: block;
    /* No local(): an installed static Saira would stand in for every weight. */
    src: url(/fonts/saira.woff2) format("woff2-variations"), url(/fonts/saira.woff2) format("woff2");
  }
  :root {
    --ground-top: #140e1f;
    --ground: #0b0a0f;
    --surface: #16131d;
    --surface-2: #1e1a27;
    --surface-3: #2a2436;
    --hairline: rgba(255, 255, 255, .07);
    --hairline-strong: rgba(255, 255, 255, .12);
    --label: #f4f2f8;
    --label-2: rgba(236, 232, 246, .64);
    --label-3: rgba(236, 232, 246, .52);
    --imperial: #b890ff;
    --imperial-deep: #7a4ddc;
    --imperial-wash: rgba(184, 144, 255, .14);
    --green: #34d15a;
    --green-deep: #1f7a36;
    --green-wash: rgba(52, 209, 90, .14);
    --amber: #ffb340;
    --gold: #f0cc70;
    --red: #ff6b61;
    --radius: 18px;
    --sans: "Saira", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Saira", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); scrollbar-color: var(--surface-3) transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--ground-top) 0, var(--ground) 560px) no-repeat, var(--ground);
    color: var(--label);
    font: 15px/1.45 var(--sans);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(184, 144, 255, .38); color: #fff; }
  :focus-visible { outline: 2px solid var(--imperial); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3, p { margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
       stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- toolbar: the one place vibrancy earns its keep, over scrolling content */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 22px;
    height: 58px; padding: 0 24px;
    background: rgba(15, 11, 21, .74);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .emblem { width: 30px; height: 30px; color: var(--imperial); display: grid; place-items: center; flex: none; }
  .emblem svg { width: 100%; height: 100%; fill: currentColor; }
  .emblem img { width: 100%; height: 100%; object-fit: contain; }
  .wordmark { display: flex; flex-direction: column; gap: 2px; }
  .wordmark h1 { font: 500 13.5px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .wordmark h1 small { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .24em; color: var(--label-3); }
  .status { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--label-2); min-width: 0; }
  .status b { color: var(--label); font-weight: 600; }
  .status > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .live.lost { color: var(--amber); }
  .live.lost i { background: var(--amber); }
  .spacer { flex: 1; }
  .tools { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 12px; border: 0; border-radius: 8px;
    background: rgba(255, 255, 255, .08); color: var(--imperial);
    font: 500 13px/1 var(--sans); cursor: pointer;
    transition: background-color .15s;
  }
  .btn:hover { background: rgba(255, 255, 255, .13); }
  .btn:active { background: rgba(255, 255, 255, .18); }
  .btn:disabled { cursor: default; color: var(--label-2); background: rgba(255, 255, 255, .05); }
  .btn.busy .i { animation: spin .8s linear infinite; }
  .btn.small { height: 28px; padding: 0 12px; }
  .btn.prime { background: var(--imperial-deep); color: #fff; }
  .btn.prime:hover { background: var(--imperial-deep); filter: brightness(1.14); }
  .link {
    background: none; border: 0; padding: 4px 7px; border-radius: 6px;
    color: var(--imperial); font: 500 13px/1.2 var(--sans); cursor: pointer;
  }
  .link:hover { background: var(--imperial-wash); }
  .link.quiet { color: var(--label-2); }
  .link.quiet:hover { background: rgba(255, 255, 255, .07); color: var(--label); }

  /* ---------- view options popover */
  #viewopts {
    position: fixed; inset: 66px 20px auto auto; margin: 0;
    width: 330px; padding: 6px;
    background: color-mix(in srgb, var(--surface-3) 94%, transparent);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--hairline-strong); border-radius: 14px;
    color: var(--label);
    box-shadow: 0 20px 50px -10px rgba(0, 0, 0, .6);
  }
  .opt { display: flex; gap: 14px; align-items: center; padding: 11px 12px; border-radius: 8px; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--hairline); border-radius: 0 0 8px 8px; }
  .opt:hover { background: rgba(255, 255, 255, .04); }
  .opt div { flex: 1; }
  .opt strong { display: block; font-size: 14px; font-weight: 600; }
  .opt small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: var(--label-2); }
  .switch {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 40px; height: 24px; border-radius: 99px; position: relative; cursor: pointer;
    background: rgba(120, 120, 128, .38); transition: background-color .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .35);
    transition: transform .25s var(--ease-out);
  }
  .switch:checked { background: var(--imperial-deep); }
  .switch:checked::after { transform: translateX(16px); }

  /* ---------- layout */
  .layout {
    display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
    gap: 36px; align-items: start;
    max-width: 1440px; margin: 0 auto; padding: 32px 28px 72px;
  }
  .side {
    position: sticky; top: 90px;
    max-height: calc(100vh - 110px); overflow-y: auto; scrollbar-width: thin;
    display: flex; flex-direction: column; gap: 34px;
    padding-right: 4px;
  }
  .main, .stacks { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  body.stale .side, body.stale .stack, body.stale .empty { opacity: .7; transition: opacity .3s; }

  /* ---------- hero: Weather's city / temperature / condition */
  .hero .place { display: flex; align-items: center; gap: 7px; font: 600 20px/1.2 var(--display); letter-spacing: -.01em; }
  .hero .place .i { width: 17px; height: 17px; color: var(--imperial); }
  .big {
    font: 300 96px/1 var(--display); letter-spacing: -.04em;
    margin: 10px 0 8px -4px; display: flex; align-items: flex-start;
  }
  .big .plus { font-size: .46em; margin: 8px 0 0 4px; color: var(--amber); letter-spacing: 0; }
  .big.tick { animation: tick .55s var(--ease-out); }
  .cond { font-size: 17px; font-weight: 500; }
  .sub { margin-top: 3px; font-size: 15px; color: var(--label-2); }
  .hero-note { margin-top: 12px; max-width: 36ch; font-size: 12.5px; line-height: 1.45; color: var(--label-2); }
  .hero-note .plus-mark { color: var(--amber); font-weight: 600; }

  /* ---------- Stocks' key-value grid */
  .facts { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; margin: 0; }
  .facts div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hairline); }
  .facts dt { font-size: 13px; color: var(--label-2); }
  .facts dd { margin: 0; font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; }

  /* ---------- ready to hand in: Stocks' watchlist, grouped by station */
  .ready h2 { font: 600 17px/1.3 var(--display); }
  .ready .lede { margin: 2px 0 12px; font-size: 13px; color: var(--label-2); }
  .ready h2 + .station { margin-top: 10px; }
  .station { border-top: 1px solid var(--hairline); }
  .station summary {
    list-style: none; cursor: pointer;
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 11px 0;
  }
  .station summary::-webkit-details-marker { display: none; }
  .station .chev { width: 14px; height: 14px; color: var(--label-3); transition: transform .2s var(--ease-out); }
  .station[open] .chev { transform: rotate(90deg); }
  .st-name { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-sys { display: block; font-size: 12.5px; color: var(--label-2); }
  .money { color: var(--green); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .station ul { list-style: none; margin: 0 0 10px 24px; padding: 0; }
  .station li {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px;
    padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 13px;
  }
  .station li .r { text-align: right; }
  .station li .d { grid-column: 1 / -1; font-size: 12px; color: var(--label-3); }
  .station li .d.warn { color: var(--amber); }

  /* ---------- a stack */
  .stack {
    background: var(--surface);
    border: 1px solid var(--hairline); border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .035) inset, 0 16px 36px -18px rgba(0, 0, 0, .7);
    overflow: clip;
  }
  .stack-head { display: flex; gap: 24px; align-items: flex-start; padding: 20px 22px 14px; }
  .stack-id { flex: 1; min-width: 0; }
  .stack-id h2 { font: 600 22px/1.2 var(--display); letter-spacing: -.01em; }
  .stack-meta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--label-2); }
  .stack-meta > span { display: inline-flex; align-items: center; gap: 5px; }
  .stack-meta .i { width: 14px; height: 14px; }
  .stack-pay { margin-top: 5px; font-size: 13px; color: var(--label-2); }
  /* A stack's figures in the ticker's grammar: label over value, detail on hover. */
  .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 14px 0 0; }
  .stats div { display: flex; flex-direction: column; gap: 3px; }
  .stats dt { font-size: 12px; color: var(--label-2); }
  .stats dd { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  /* Bounties worth more for where they'll be cashed in (a Powerplay bonus). */
  .gold, .facts dd.gold { color: var(--gold); }
  .stack-num { text-align: right; flex: none; }
  .stack-num b { display: block; font: 300 50px/1 var(--display); letter-spacing: -.035em; }
  .stack-num b .plus { font-size: .52em; color: var(--amber); vertical-align: 18px; margin-left: 2px; }
  .stack-num span { font-size: 12px; color: var(--label-2); }
  .stack-meta .here-now { color: var(--green); font-weight: 600; }

  .says { display: grid; gap: 7px; padding: 0 22px 16px; }
  .say { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; color: var(--label-2); max-width: 78ch; }
  .say b { color: var(--label); font-weight: 600; }
  .say .i { margin-top: 2px; width: 15px; height: 15px; }
  .say.warn { color: var(--amber); }
  .say.warn b { color: var(--amber); }

  .giver { border-top: 1px solid var(--hairline); padding: 13px 22px 4px; }
  .giver-head { display: flex; align-items: baseline; gap: 12px; }
  .giver-head h3 { flex: 1; min-width: 0; font: 600 15px/1.3 var(--sans); }
  .giver-kills { font-size: 13px; color: var(--label-2); white-space: nowrap; }
  .giver-kills em { font-style: normal; margin-left: 8px; color: var(--imperial); }
  .missions { list-style: none; margin: 2px 0 0; padding: 0; }
  .mission {
    display: grid; grid-template-columns: minmax(0, 1fr) 78px 138px 96px 58px;
    gap: 16px; align-items: center; padding: 10px 0;
  }
  .mission + .mission { border-top: 1px solid var(--hairline); }
  .mission.expired { opacity: .62; }

  /* Weather's range row: every mission is a segment on its stack's one kill
     axis. A giver's queue lays its missions end to end from 0; all queues in
     a stack share the scale, so the one that sets the pace reaches the end. */
  .range { display: flex; align-items: center; gap: 10px; }
  .range .lo, .range .hi { width: 30px; font-size: 13px; flex: none; }
  .range .lo { text-align: right; font-weight: 600; }
  .range .hi { color: var(--label-2); }
  .track { position: relative; flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .045); }
  .track .seg, .track .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; min-width: 12px; }
  .track .seg { background: rgba(255, 255, 255, .14); }
  .track .fill {
    background: linear-gradient(90deg, var(--imperial-deep), var(--imperial));
    clip-path: inset(0 calc((1 - var(--p, 0)) * 100%) 0 0 round 99px);
    transition: clip-path .7s var(--ease-out);
  }
  .mission.capped .track .fill { background: var(--amber); }
  .mission.queued .track .seg { background: repeating-linear-gradient(90deg, rgba(184, 144, 255, .38) 0 4px, transparent 4px 8px); }
  .mission.queued .range .lo { color: var(--label-3); font-weight: 400; }
  .m-where { margin: 5px 0 0 40px; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--label-3); }
  .m-where b { font-weight: 500; color: var(--label-2); }
  .m-where .starts { color: var(--label-2); }
  .m-where .corrected { color: var(--imperial); }
  body.hide-where .w-sys { display: none; }
  .m-main { min-width: 0; }
  /* Every row one line tall on desktop: the hand-in station truncates, never wraps. */
  @media (min-width: 721px) {
    .m-where { flex-wrap: nowrap; }
    .m-where > span { white-space: nowrap; flex: none; }
    .m-where > .w-sys { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  }
  .m-left { text-align: right; font-size: 13px; color: var(--label-2); white-space: nowrap; }
  .m-left b { font-size: 15px; font-weight: 600; color: var(--label); }
  .mission.capped .m-left b { color: var(--amber); }
  .m-reward { text-align: right; font-size: 13px; white-space: nowrap; }
  .m-due { display: flex; justify-content: flex-end; align-items: center; gap: 5px; font-size: 13px; color: var(--label-2); white-space: nowrap; }
  .m-due .i { width: 14px; height: 14px; }
  .m-due.soon { color: var(--amber); }
  .m-due.gone { color: var(--red); }
  .m-act { text-align: right; }

  .sync-form {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 2px 0 4px 40px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2);
    font-size: 13px; color: var(--label-2);
  }
  .sync-form input {
    width: 76px; height: 28px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--hairline-strong); background: var(--ground); color: var(--label);
    font: 600 14px var(--sans); font-variant-numeric: tabular-nums; caret-color: var(--imperial);
  }
  .sync-form input:focus { outline: 2px solid var(--imperial); outline-offset: 0; }

  /* ---------- empty / teaching state */
  .empty { padding: 34px 32px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--hairline); }
  .empty h2 { font: 600 22px/1.25 var(--display); }
  .empty p { margin-top: 10px; max-width: 62ch; color: var(--label-2); }
  .empty p b { color: var(--label); font-weight: 600; }

  .foot { font-size: 12px; color: var(--label-3); padding: 4px 2px; }
  .banner { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-radius: 12px; background: rgba(255, 179, 64, .1); color: var(--amber); font-size: 13.5px; }
  [hidden] { display: none !important; }

  /* ---------- toolbar: view switch and mission slots */
  /* Concentric on the system's own steps: control radius outside, link radius
     inside the 2px padding. */
  .segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .08); }
  .segmented button {
    height: 26px; padding: 0 14px; border: 0; border-radius: 6px; background: none;
    color: var(--label-2); font: 500 13px/1 var(--sans); cursor: pointer;
  }
  .segmented button:hover { color: var(--label); }
  .segmented button[aria-selected="true"] { background: rgba(255, 255, 255, .16); color: var(--label); box-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
  .viewbar { display: flex; align-items: center; gap: 16px; }
  .slots { font-size: 13px; color: var(--label-2); white-space: nowrap; }
  .slots b { color: var(--label); font-weight: 600; }
  .slots.full b { color: var(--amber); }

  /* ---------- this session: a Stocks-style ticker strip over the stacks */
  .now { display: grid; gap: 12px; }
  .ticker { display: flex; flex-wrap: wrap; gap: 10px 30px; padding: 0 2px 16px; border-bottom: 1px solid var(--hairline); }
  .ticker div { display: flex; flex-direction: column; gap: 3px; }
  .ticker span { font-size: 12px; color: var(--label-2); }
  .ticker b { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .say.good { color: var(--label-2); }
  .say.good .i { color: var(--green); }
  .say.bad { color: var(--red); }

  /* ---------- Ranks: combat, Imperial Navy and Powerplay on the range grammar */
  .standing h2 { font: 600 17px/1.3 var(--display); margin-bottom: 14px; }
  .rankbar + .rankbar { margin-top: 18px; }
  .rankbar .range .lo, .rankbar .range .hi { width: auto; min-width: 66px; font-size: 12.5px; white-space: nowrap; }
  .rankbar .range .lo { text-align: left; font-weight: 600; }
  .rankbar .range .hi { text-align: right; }
  .rankbar p { margin-top: 7px; font-size: 12.5px; line-height: 1.45; color: var(--label-2); }
  .rankbar p b { color: var(--label); font-weight: 600; }
  .track .pending {
    position: absolute; top: 0; bottom: 0; border-radius: 99px;
    background: repeating-linear-gradient(90deg, rgba(184, 144, 255, .6) 0 4px, transparent 4px 8px);
  }

  /* standing with a mission provider: state, so it carries state colour */
  .standing-word { font-size: 12.5px; font-weight: 500; margin-left: 8px; }
  .st-Allied, .st-Friendly { color: var(--green); }
  .st-Cordial { color: var(--label-2); }
  .st-Neutral { color: var(--label-3); }
  .st-Unfriendly { color: var(--amber); }
  .st-Hostile { color: var(--red); }
  .m-due.risk { color: var(--amber); }
  .st-order { color: var(--imperial); font-weight: 600; margin-right: 6px; }

  /* ---------- journal view */
  #journalView .side { position: static; max-height: none; overflow: visible; }
  .kv { margin: 0; }
  .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 13px; }
  .kv dt { color: var(--label-2); min-width: 0; }
  .kv dd { margin: 0; font-weight: 600; text-align: right; white-space: nowrap; }
  .kv small { display: block; font-size: 12px; font-weight: 400; color: var(--label-3); }
  .block h2 { font: 600 17px/1.3 var(--display); margin-bottom: 8px; }
  .list-head, .hist li, .sess li {
    display: grid; gap: 14px; align-items: baseline; padding: 11px 22px; font-size: 13px;
  }
  .list-head, .hist li { grid-template-columns: minmax(0, 1fr) 58px 96px 96px 96px 96px; }
  .list-head, .sess li { }
  .sess .list-head, .sess li { grid-template-columns: minmax(0, 1fr) 70px 58px 110px 110px 80px; }
  .list-head { padding-top: 0; padding-bottom: 8px; font-size: 12px; color: var(--label-3); }
  .list-head span:not(:first-child), .hist li > span:not(:first-child), .sess li > span:not(:first-child) { text-align: right; white-space: nowrap; }
  .hist, .sess { list-style: none; margin: 0; padding: 0; }
  .hist li, .sess li { border-top: 1px solid var(--hairline); }
  .hist .name b { display: block; font-size: 15px; font-weight: 600; }
  .hist .name small, .sess .name small { display: block; margin-top: 2px; font-size: 12px; color: var(--label-3); }
  .live-run { color: var(--imperial); }
  .lost { color: var(--amber); }
  .dim { color: var(--label-3); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes tick {
    from { transform: translateY(10px); opacity: .25; color: var(--imperial); }
    60% { color: var(--imperial); }
    to { transform: none; opacity: 1; }
  }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; gap: 28px; padding: 22px 18px 56px; }
    .side { position: static; max-height: none; overflow: visible; padding: 0; }
    .status .cmdr { display: none; }
  }
  @media (max-width: 1100px) {
    .list-head, .hist li { grid-template-columns: minmax(0, 1fr) 50px 84px 84px 84px; }
    .hist li > .per-hour, .list-head .per-hour { display: none; }
  }
  @media (max-width: 720px) {
    /* iOS's pattern for a narrow bar: name and buttons on the first row, the
       view switch full width beneath -- so the name never has to go. */
    .toolbar { flex-wrap: wrap; height: auto; gap: 10px 12px; padding: 10px 14px; }
    .status .live { display: none; }
    .viewbar { order: 10; flex-basis: 100%; }
    .viewbar .segmented { flex: 1; }
    .viewbar .segmented button { flex: 1; }
    .list-head { display: none; }
    /* No column headers at this width, so each figure carries its label on a
       line of its own: every value sits in the same place on every row. */
    .hist li, .sess li { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; padding: 12px 16px; }
    .hist li > .name, .sess li > .name { grid-column: 1 / -1; }
    .hist li > span:not(:first-child), .sess li > span:not(:first-child) { text-align: left; white-space: nowrap; }
    .hist li > [data-label]::before, .sess li > [data-label]::before {
      content: attr(data-label); display: block; margin-bottom: 1px;
      font-size: 11.5px; color: var(--label-3); font-weight: 400;
    }
    .hist li > .per-hour { display: block; }
    .status .place-now, .tools .label { display: none; }
    .wordmark h1 { letter-spacing: .12em; }
    .wordmark h1 small { letter-spacing: .19em; }
    .big { font-size: 80px; }
    .stack-head { padding: 18px 16px 12px; }
    .says { padding: 0 16px 14px; }
    .giver { padding: 12px 16px 4px; }
    .mission { grid-template-columns: auto auto 1fr auto; gap: 6px 14px; }
    .m-main { grid-column: 1 / -1; }
    .m-left, .m-reward { text-align: left; }
    .m-due { justify-content: flex-start; }
    .m-where, .sync-form { margin-left: 0; }
  }
  /* ---------- welcome: the one authored moment. The dashboard blurs behind a
     card; a reticle ring draws itself around the emblem, light blooms and
     sweeps across it, the greeting comes into focus, then everything dissolves
     back into the dashboard. About three seconds; any click or key skips it. */
  .welcome {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
    background: rgba(6, 5, 10, .5);
    -webkit-backdrop-filter: blur(16px) saturate(125%); backdrop-filter: blur(16px) saturate(125%);
    animation: welcome-veil .45s ease-out both;
    cursor: pointer;
  }
  .welcome[hidden] { display: none; }
  .welcome-card {
    position: relative; width: min(360px, 100%); padding: 36px 30px 30px; text-align: center;
    border-radius: var(--radius); border: 1px solid var(--hairline-strong);
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 40px 90px -30px rgba(0, 0, 0, .7);
    animation: welcome-card .7s .08s var(--ease-out) both;
  }
  .welcome-mark { position: relative; width: 120px; height: 120px; margin: 0 auto; display: grid; place-items: center; }
  .welcome-glow {
    position: absolute; inset: -18%; border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 144, 255, .42), rgba(122, 77, 220, .12) 45%, transparent 68%);
    animation: welcome-glow 1.6s .3s var(--ease-out) both;
  }
  .welcome-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .welcome-ring circle { fill: none; stroke: var(--imperial); stroke-width: 1.5; stroke-linecap: round;
    stroke-dasharray: 352; transform: rotate(-90deg); transform-origin: 60px 60px;
    animation: welcome-draw 1s .2s cubic-bezier(.65, 0, .35, 1) both; }
  .welcome-ring path { fill: none; stroke: var(--imperial); stroke-width: 1.5; stroke-linecap: round;
    animation: welcome-fade .5s .95s ease-out both; }
  .welcome-emblem { position: relative; width: 74px; height: 74px; color: var(--imperial);
    animation: welcome-emblem .9s .3s var(--ease-out) both; }
  .welcome-emblem img, .welcome-emblem svg { width: 100%; height: 100%; object-fit: contain; fill: currentColor; display: block; }
  .welcome-emblem [hidden] { display: none; }
  .welcome-emblem::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .7) 50%, transparent 60%) 150% 0 / 260% 100% no-repeat;
    -webkit-mask: url(/emblem) center / contain no-repeat; mask: url(/emblem) center / contain no-repeat;
    animation: welcome-sheen 1s 1.05s ease-in-out both;
  }
  .welcome-org { margin-top: 24px; font-size: 11px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase;
    line-height: 1.7; color: var(--label-3); animation: welcome-track .9s .7s var(--ease-out) both; }
  .welcome-org span { display: block; white-space: nowrap; }
  .welcome-title { margin-top: 10px; font-size: 26px; font-weight: 600; line-height: 1.15; }
  .welcome-title span { display: inline-block; animation: welcome-word .75s var(--ease-out) both; }
  .welcome-title span:first-child { animation-delay: .85s; }
  .welcome-title span:last-child { animation-delay: .97s; }
  .welcome-name { min-height: 1.45em; margin-top: 6px; font-size: 13px; color: var(--label-2);
    animation: welcome-fade .6s 1.2s ease-out both; }
  .welcome-rule { display: block; width: 72px; height: 1px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--imperial), transparent);
    animation: welcome-rule .8s 1.1s var(--ease-out) both; }
  .welcome.leaving { animation: welcome-veil-out .5s .06s ease-in both; }
  .welcome.leaving .welcome-card { animation: welcome-card-out .42s ease-in both; }

  @keyframes welcome-veil { from { opacity: 0; } }
  @keyframes welcome-veil-out { to { opacity: 0; } }
  @keyframes welcome-card { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  @keyframes welcome-card-out { to { opacity: 0; transform: scale(.97); filter: blur(6px); } }
  @keyframes welcome-draw { from { stroke-dashoffset: 352; } to { stroke-dashoffset: 0; } }
  @keyframes welcome-glow { from { opacity: 0; transform: scale(.55); } 45% { opacity: 1; } to { opacity: .6; transform: scale(1); } }
  @keyframes welcome-emblem { from { opacity: 0; transform: scale(.82); filter: blur(6px); } }
  @keyframes welcome-sheen { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes welcome-track { from { opacity: 0; letter-spacing: .55em; } }
  @keyframes welcome-word { from { opacity: 0; transform: translateY(8px); filter: blur(8px); } }
  @keyframes welcome-fade { from { opacity: 0; } }
  @keyframes welcome-rule { from { transform: scaleX(0); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<!--
  THESIS: A glance-and-go ledger for Imperial massacre stacking: one huge kill count, then each target's provider queues read as Weather-style range rows. Refuses the gaming-HUD dashboard of orange stat tiles and badge clutter.
  OWN-WORLD: Apple Stocks/Weather dark grammar, commissioned for Arissa Lavigny-Duval's pilots: violet-black ground, elevated plum-neutral surfaces, one imperial violet for progress, emblem and controls; system green/amber/red only for state; one face everywhere, Saira (squared, Eurostile-style lettering like Elite's own cockpit panels), with thin display numerals and tracked capitals for the wordmark; authored 1.75-stroke icons; hairline key-value grids.
  STORY: Alt-tab in; read kills left, pay per kill and bounties earned; see which provider sets the pace, what the locked ship counts for, and where to hand in; alt-tab out. The Journal view answers what stacking has earned over time.
  FIRST VIEWPORT: Sticky vibrancy toolbar (ALD emblem, wordmark, live state, system, Stacks|Journal segmented control, mission slots, View, Refresh). Left 360px sticky column: current system, 96px thin kill count, condition sentence, Stocks key-value grid, ranks as three range-bars (combat, Imperial Navy, Powerplay), hand-in list in route order. On first open, a welcome card (the emblem inside a drawn reticle ring, Welcome, Commander) resolves over the blurred dashboard and dissolves into it. Right: this-session ticker strip, then stack cards, largest first.
  FORM: pinned by the user (Stocks/Weather as an Imperial device), overriding roll 580ddb69 (assigned #7). Raise, from the phosphor terminal: states print themselves as sentences, not badges.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<script>
const $ = (id) => document.getElementById(id);
const NBSP = " ";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cr = (n) => (n || 0).toLocaleString("en-US").replace(/,/g, NBSP);
const icon = (name, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const dur = (h) => {
  if (h == null) return "—";
  const m = Math.max(1, Math.round(h * 60));
  // non-breaking spaces: a duration never splits across lines ("1 h 20 / m")
  return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} m` : `${m} m`;
};
const crM = (n) => ((n || 0) >= 1e6 ? `${((n || 0) / 1e6).toFixed(1)}M` : cr(n));
// One scale per column: millions to one decimal, and "<0.1M" rather than a
// full figure that would sit unreadably beside "35.1M".
const colM = (n) => ((n || 0) < 50000 ? "<0.1M" : `${((n || 0) / 1e6).toFixed(1)}M`);
// Gold, with the logged figure on hover, when a Powerplay bonus lifts bounties.
const bonusTip = (logged, paid) => (paid && logged && paid > logged
  ? ` class="gold" title="${cr(logged)} Cr logged; worth ${cr(paid)} Cr cashed in where they were earned, with its Powerplay bounty bonus"` : "");
// Stat-cell money, Stocks style: 41.3M, 590K. The full figure is in the tooltip.
const short = (n) => {
  const v = n || 0;
  if (v >= 1e9) return `${(v / 1e9).toFixed(1)}B`;
  if (v >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
  if (v >= 1e4) return `${Math.round(v / 1e3)}K`;
  return cr(v);
};
const monthYear = (iso) => (iso ? new Date(iso).toLocaleDateString("en-GB", { month: "short", year: "numeric" }) : "");
const dayMonth = (iso) => (iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" }) : "");
const standingWord = (p) => (p && p.standing
  ? `<span class="standing-word st-${p.standing}" title="${esc(p.since_marks
      ? `Reputation about ${Math.round(p.rep)} of 100: ${Math.round(p.logged_rep)} at your last jump into this faction’s space, plus the “+” from missions handed in since`
      : `Reputation ${Math.round(p.rep)} of 100, as of your last jump into this faction’s space`)}">${p.standing}</span>` : "");
const paceWords = (pace) => (pace && pace.source === "session" ? "this session’s pace" : "your usual pace");
// The rate itself, stated as hunting time -- it counts only the time spent
// fighting, so it reads faster than the session strip's kills over the whole
// session, and must say so rather than invite the wrong comparison.
const paceRate = (pace) => (pace ? `${pace.per_hour} kills an hour of hunting` : "");
let lastState = null;

function until(iso) {
  if (!iso) return { text: "no deadline", cls: "", left: null };
  const left = (new Date(iso) - Date.now()) / 1000;
  if (left <= 0) return { text: "expired", cls: "gone", left };
  const d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600);
  const m = Math.floor(left % 3600 / 60), s = Math.floor(left % 60);
  const text = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${s}s`;
  return { text, cls: left < 7200 ? "soon" : "", left };
}

// A finished mission's deadline is informational: the game keeps it payable
// afterwards, then drops it without warning some days later.
function deadline(iso) {
  if (!iso) return { text: "No deadline", warn: false };
  const left = (new Date(iso) - Date.now()) / 1000;
  if (left > 0) return { text: `Deadline in ${until(iso).text} · still payable after`, warn: false };
  const days = Math.floor(-left / 86400);
  if (days < 1) return { text: "Deadline passed today · still payable", warn: false };
  return days >= 3
    ? { text: `Deadline passed ${days}d ago · collect soon, the game drops these`, warn: true }
    : { text: `Deadline passed ${days}d ago · still payable`, warn: false };
}

/* ------------------------------------------------------------------ side */

function renderSide(s) {
  const t = s.totals;
  const unsure = s.groups.some((g) => g.uncertain);
  const anyHeld = s.groups.some((g) => g.held_back > 0);
  let cond;
  if (t.missions) cond = `kills to clear ${plural(t.missions, "mission")}`;
  else if (s.ready.length) cond = "Every stack is finished";
  else cond = "No massacre missions in the journal";

  const bounties = t.bounties_paid ?? t.bounties;   // once per system: stacks there share one stream of kills
  const facts = [
    ["Per kill", t.cr_per_kill ? `${cr(t.cr_per_kill)} Cr` : "—"],
    ["Stacking saves", t.kills_saved ? `${cr(t.kills_saved)} kills` : "—"],
    ["One at a time", t.kills_naive ? `${cr(t.kills_naive)} kills` : "—"],
    ["Bounties", bounties ? `${cr(bounties)} Cr` : "—", bonusTip(t.bounties, t.bounties_paid)],
    ["Missions", t.missions || "—"],
    ["To collect", t.ready_reward ? `${cr(t.ready_reward)} Cr` : "—"],
  ];

  $("side").innerHTML = `
    <section class="hero" aria-live="polite">
      <p class="place">${icon("pin")}${esc(s.current_system || "System unknown")}</p>
      <p class="big" id="heroNum">${cr(t.kills_needed)}${unsure ? '<span class="plus" title="At least — some of your kills haven’t counted in the game">+</span>' : ""}</p>
      <p class="cond">${cond}</p>
      ${t.reward ? `<p class="sub">${cr(t.reward)} Cr on the table</p>` : ""}
      ${unsure ? `<p class="hero-note"><b class="plus-mark">+</b> means at least — ${anyHeld
        ? "the game hasn’t counted some of your kills. The stack below says how many."
        : "some counts below can’t be separated in the journal."}</p>` : ""}
    </section>
    <dl class="facts">${facts.map(([k, v, tip]) => `<div><dt>${k}</dt><dd${tip || ""}>${v}</dd></div>`).join("")}</dl>
    ${standingHTML(s.imperial, s.powerplay, s.combat)}
    ${s.ready.length ? renderReady(s.ready, s.route) : ""}`;
}

// Imperial Navy rank and Powerplay rank, drawn on the same range grammar as
// the missions: where you are between this rank and the next.
function rankBar(lo, hi, p, pending, label) {
  const at = Math.max(0, Math.min(1, p));
  return `
    <div class="range"><span class="lo">${esc(lo)}</span>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="${Math.round(at * 100)}" aria-label="${esc(label)}">
        <span class="seg" style="left:0;width:100%"></span>
        ${pending ? `<span class="pending" style="left:${at * 100}%;width:${Math.min(pending, 1 - at) * 100}%"></span>` : ""}
        <i class="fill" style="left:0;width:100%;--p:${at}"></i>
      </div>
      <span class="hi">${esc(hi || "")}</span></div>`;
}

function standingHTML(imp, pp, cb) {
  if (!imp && !pp && !cb) return "";
  let html = "";
  // Combat: the journal records progress only at log-in, so this session's
  // ship kills are added at the rate they've moved this rank before (hatched).
  if (cb && cb.progress != null) {
    const why = cb.gain
      ? ` title="${esc(`${cb.progress}% at log-in (the journal records rank progress only then). Your ${cb.kills} ship kills since should add about ${cb.gain}%: at ${cb.title} it has taken about ${cb.kills_per_pct.toFixed(1)} kills per 1%, measured over ${cr(cb.basis_kills)} of your kills.`)}"` : "";
    html += `<div class="rankbar">
      ${rankBar(cb.title, cb.next || "", cb.progress / 100, cb.gain ? cb.gain / 100 : 0,
                `Combat: ${cb.progress}% toward ${cb.next || "the top"}`)}
      <p${why}><b>${cb.progress}%</b>${cb.gain ? ` · <b>+${cb.gain}%</b> this session` : ""}${
        cb.kills_to_next != null ? ` · about ${cr(cb.kills_to_next)} kills to go` : ""}</p>
    </div>`;
  }
  if (imp && imp.progress != null) {
    const gain = imp.pending_gain;
    const to = gain ? Math.min(100, imp.progress + gain) : null;
    const basis = gain && imp.per_plus && imp.basis_missions
      ? ` title="${esc(`Your ${imp.imperial_missions} Imperial missions should take you to about ${Math.round(to)}%. Measured from ${imp.basis_missions} of your own Imperial missions at ${imp.title}: about ${imp.per_plus.toFixed(2)}% per reputation “+”.`)}"` : "";
    html += `<div class="rankbar">
      ${rankBar(imp.title, imp.next, imp.progress / 100, gain ? gain / 100 : 0,
                `Imperial Navy: ${imp.progress}% toward ${imp.next || "the top"}`)}
      <p${basis}><b>${imp.progress}%</b>${gain ? ` · <b>+${gain}%</b> after hand-in` : ""}</p>
    </div>`;
  }
  if (pp) {
    const session = pp.session ? ` · <b>+${cr(pp.session)}</b> this session` : "";
    if (pp.rank == null) {
      html += `<div class="rankbar" title="${esc(pp.power)}"><p><b>${cr(pp.merits)}</b> merits${session}</p></div>`;
    } else {
      const span = pp.next_rank_at - pp.rank_floor;
      html += `<div class="rankbar" title="${esc(pp.power)}">
        ${rankBar(`Rank ${pp.rank}`, `Rank ${pp.rank + 1}`, span ? (pp.merits - pp.rank_floor) / span : 0, 0,
                  `${pp.power}: ${pp.merits} merits toward rank ${pp.rank + 1}`)}
        <p><b>${cr(pp.merits)}</b> merits · ${cr(pp.to_next)} to go${session}</p>
      </div>`;
    }
  }
  return `<section class="standing"><h2>Ranks</h2>${html}</section>`;
}

const openStations = new Set();

function renderReady(ready, route) {
  const byStation = new Map();
  for (const r of ready) {
    const key = `${r.station}|${r.system}`;
    if (!byStation.has(key)) byStation.set(key, { station: r.station, system: r.system, items: [], total: 0 });
    const g = byStation.get(key);
    g.items.push(r); g.total += r.reward;
  }
  // Route order: nearest first from where you are, then nearest from each stop.
  const stops = (route && route.stops) || [];
  const order = stops.map((st) => `${st.station}|${st.system}`);
  const leg = new Map(stops.map((st) => [`${st.station}|${st.system}`, st.leg_ly]));
  const stations = [...byStation.entries()].sort((a, b) =>
    (order.indexOf(a[0]) + 1 || 999) - (order.indexOf(b[0]) + 1 || 999));
  const total = ready.reduce((n, r) => n + r.reward, 0);
  const multi = stations.length > 1;
  return `
    <section class="ready">
      <h2 title="Finished missions stay payable after their deadline, but the game drops them some days later without writing anything to the journal.">Ready to hand in</h2>
      ${multi ? `<p class="lede">${plural(stations.length, "stop")} · ${cr(total)} Cr${
        route && route.total_ly ? ` · ${route.total_ly} ly` : ""}</p>` : ""}
      ${stations.map(([key, g], i) => {
        const ly = leg.get(key);
        const hop = ly == null ? "distance unknown" : i === 0 ? `${ly} ly away` : `+${ly} ly`;
        return `
        <details class="station" data-key="${esc(key)}" ${openStations.has(key) ? "open" : ""}>
          <summary>
            ${icon("chev", "i chev")}
            <span><span class="st-name">${multi ? `<span class="st-order">${i + 1}</span>` : ""}${esc(g.station || "Unknown station")}</span>
              <span class="st-sys">${esc(g.system || "?")} · ${plural(g.items.length, "mission")} · ${hop}</span></span>
            <span class="money">${cr(g.total)} Cr</span>
          </summary>
          <ul>${g.items.map((r) => {
            const d = deadline(r.expiry);
            return `<li><span>${esc(r.giver || "?")}</span><span class="r">${cr(r.reward)} Cr</span>
              <span class="d ${d.warn ? "warn" : ""}" data-deadline="${esc(r.expiry || "")}">Killed in ${esc(r.target_system || "?")} · ${d.text}</span></li>`;
          }).join("")}</ul>
        </details>`;
      }).join("")}
    </section>`;
}

/* ------------------------------------------------------------------ stacks */

// seg: where this mission sits on its stack's shared kill axis (see .range CSS).
function missionRow(m, prev, seg, axis, headDone, risk) {
  const p = m.required ? m.done / m.required : 0;
  const from = prev.has(m.id) ? prev.get(m.id) : p;
  const due = until(m.expiry);
  const origin = m.origin_station ? `${esc(m.origin_station)}, ${esc(m.origin_system)}` : "origin not in the journal";
  const cls = [m.queued && "queued", m.capped && "capped", m.expired && "expired"].filter(Boolean).join(" ");
  const tip = m.capped
    ? ' title="By the kills logged this mission is done, but the game still lists it as active, so some of those kills didn’t count."'
    : "";
  const start = seg ? seg.start : 0;
  const end = seg ? seg.end : m.required;
  const at = seg ? `left:${(start / axis * 100).toFixed(3)}%;width:${(m.required / axis * 100).toFixed(3)}%` : "";
  const lo = m.queued ? cr(start) : cr(m.done);
  const aria = m.queued
    ? `${m.giver}: queued, covers kills ${start} to ${end} of this faction's queue`
    : `${m.giver}: ${m.done} of ${m.required} kills`;
  return `
    <li class="mission ${cls}" data-id="${m.id}" data-req="${m.required}" data-done="${m.done}" data-synced="${m.synced ? 1 : 0}"${tip}>
      <div class="m-main">
        <div class="range">
          <span class="lo">${lo}</span>
          <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${m.required}"
               aria-valuenow="${m.queued ? 0 : m.done}" aria-label="${esc(aria)}">
            ${seg ? `<span class="seg" style="${at}"></span>` : ""}
            ${seg && !m.queued ? `<i class="fill" style="${at};--p:${from}" data-p="${p}"></i>` : ""}
          </div>
          <span class="hi">${cr(end)}</span>
        </div>
        <p class="m-where">
          ${m.queued ? `<span class="starts">Starts in ${plural(Math.max(0, start - headDone), "kill")}</span>` : ""}
          ${m.wing ? "<span>Wing mission</span>" : ""}
          ${m.synced ? '<span class="corrected">Corrected by hand</span>' : ""}
          <span class="w-sys">Hand in at <b>${origin}</b></span>
        </p>
      </div>
      <div class="m-left"><b>${cr(m.remaining)}${m.held ? "+" : ""}</b> left</div>
      <div class="m-reward">${cr(m.reward)} Cr</div>
      <div class="m-due ${risk ? "risk" : due.cls}" data-expiry="${esc(m.expiry || "")}" data-risk="${risk ? 1 : 0}"
           title="${risk ? `At ${risk}, this mission’s kills won’t come before it expires.`
                         : "Time left to finish the kills. Once they are done you can hand in whenever."}">
        ${icon("clock")}<span>${due.text}</span></div>
      <div class="m-act">${m.queued || m.expired ? "" : `<button class="link" type="button" data-sync>Sync</button>`}</div>
    </li>`;
}

function stackCard(g, prev, solo, explained, target, slotsFree) {
  const givers = new Map();
  const chainInfo = new Map(g.chains.map((c) => [c.giver, c]));
  for (const m of g.missions) {
    if (!givers.has(m.giver)) givers.set(m.giver, []);
    givers.get(m.giver).push(m);
  }
  const chainKills = new Map(g.chains.map((c) => [c.giver, c.kills]));
  const pace = g.chains.length ? g.chains[0].giver : null;
  const order = [...givers.keys()].sort((a, b) => (chainKills.get(b) || 0) - (chainKills.get(a) || 0));

  // One kill axis for the whole stack: each giver's queue laid end to end from 0.
  const segs = new Map(), headDone = new Map();
  let axis = 1;
  for (const [giver, list] of givers) {
    list.sort((a, b) => a.position - b.position);
    let at = 0;
    for (const m of list) {
      if (m.expired) continue;
      segs.set(m.id, { start: at, end: at + m.required });
      if (!m.queued && !headDone.has(giver)) headDone.set(giver, m.done);
      at += m.required;
    }
    axis = Math.max(axis, at);
  }

  // Expiry risk: a queued mission earns nothing until its turn, so at this
  // pace some can run out of time before their kills arrive.
  const rate = g.pace && g.pace.per_hour;
  const paceText = rate ? `${paceWords(g.pace)} (${paceRate(g.pace)})` : "";
  const risky = new Map();
  if (rate) {
    for (const [giver, list] of givers) {
      const done = headDone.get(giver) || 0;
      for (const m of list) {
        const sg = segs.get(m.id);
        if (!sg || !m.expiry) continue;
        const hoursNeeded = Math.max(0, sg.end - done) / rate;
        const hoursLeft = (new Date(m.expiry) - Date.now()) / 3.6e6;
        if (hoursNeeded > hoursLeft) risky.set(m.id, { giver, start: sg.start, end: sg.end });
      }
    }
  }

  const says = [];
  if (target && target.faction === g.target_faction) {
    const who = `${esc(target.ship)}${target.rank ? `, ${esc(target.rank)}` : ""}`;
    const bounty = target.bounty ? ` title="${cr(target.bounty)} Cr bounty"` : "";
    if (target.verdict === "counts") {
      // This stack's own queue heads only: with Pirates and Deserters of one
      // faction both in play, one kill is one or the other, never both.
      says.push(`<p class="say good"${bounty}>${icon("target")}<span>Locked: <b>${who}</b> — counts for ${plural(g.chains.length, "mission")}${g.mixed_types ? ` if it’s one of the ${esc((g.target_type || "").toLowerCase())}` : ""}.</span></p>`);
    } else if (target.verdict === "wrong_system") {
      says.push(`<p class="say warn">${icon("target")}<span>Locked: <b>${who}</b> — only counts in ${esc(g.system)}.</span></p>`);
    }
  }
  if (risky.size) {
    const one = [...risky.values()][0];
    says.push(`<p class="say warn" title="At ${esc(paceText)}">${icon("clock")}<span>${risky.size === 1
      ? `<b>${esc(one.giver)}</b>’s mission at kills ${one.start}–${one.end} expires before it’s done at this pace.`
      : `${risky.size} missions expire before they’re done at this pace — deadlines in amber.`}</span></p>`);
  }
  if (g.held_back > 0 && g.held_by) {
    says.push(`<p class="say warn" title="By the kills logged, this mission is done, but the game still lists it as active.">${icon("alert")}<span>At least ${plural(g.held_back, g.uncounted > 0 ? "more kill" : "kill")} didn’t count — held until <b>${esc(g.held_by)}</b>’s mission completes.</span></p>`);
  }
  if (g.uncounted) {
    const n = Math.abs(g.uncounted);
    says.push(`<p class="say" title="Measured from the missions the game has completed in this stack.">${icon("check")}<span>${g.uncounted > 0
      ? `${plural(n, "logged kill")} didn’t count in the game, so ${n === 1 ? "it’s" : "they’re"} left out.`
      : `The game counted ${plural(n, "kill")} more than were logged, so ${n === 1 ? "it’s" : "they’re"} included.`}</span></p>`);
  }
  if (g.mixed_types) {
    const key = `${g.target_faction}|${g.system}`;
    if (!explained.has(key)) {
      explained.add(key);
      says.push(`<p class="say warn">${icon("alert")}<span>Two kinds of target are both in play here — the journal can’t tell their kills apart, so trust the game’s completions.</span></p>`);
    } else {
      says.push(`<p class="say">${icon("up")}<span>Shares its kills with the ${esc(g.target_faction)} stack above.</span></p>`);
    }
  }

  // The stack's figures, Stocks style; each carries its full detail on hover.
  const n = g.next_payout;
  const payer = n && g.missions.find((m) => !m.queued && !m.expired && m.remaining === n.kills);
  const stats = [
    ...(n ? [["Next payout", plural(n.kills, "kill"),
              `${cr(n.reward)} Cr${payer ? ` from ${payer.giver}` : ""}${n.missions > 1 ? ` across ${n.missions} missions` : ""}`]] : []),
    ...(g.eta_hours ? [["Finishes in", dur(g.eta_hours), `At ${paceWords(g.pace)}: ${paceRate(g.pace)}`]] : []),
    ["Rewards", short(g.reward), `${cr(g.reward)} Cr in mission rewards across ${plural(g.mission_count, "mission")}`],
    ["Per kill", short(g.cr_per_kill), `${cr(g.cr_per_kill)} Cr of mission pay a kill`],
    ["Bounties", short(g.bounties_paid ?? g.bounties ?? 0), `${cr(g.bounties || 0)} Cr in bounties here so far${g.bounty_kills ? `, from ${plural(g.bounty_kills, "kill")}` : ""}${
      g.bonus_rate ? `; ${cr(g.bounties_paid)} Cr cashed in here, with ${esc(g.bonus_power)}’s +${Math.round(g.bonus_rate * 100)}% ${esc((g.bonus_state || "").toLowerCase())} bonus` : ""}`, g.bonus_rate ? "gold" : ""],
    ...(g.bonds ? [["Combat bonds", short(g.bonds), `${cr(g.bonds)} Cr in combat bonds here`]] : []),
  ];

  // Why the longest queue sets the cost, for anyone who hovers it.
  const paceChain = g.chains[0];
  const biggest = Math.max(0, ...g.missions.filter((m) => !m.expired).map((m) => m.remaining));
  const paceWhy = paceChain && paceChain.missions > 1 && g.kills_needed > biggest
    ? `${paceChain.giver}’s ${paceChain.missions} missions run one after another, so this stack takes ${g.kills_needed} kills instead of ${biggest}.`
    : "The longest queue here: it decides how many kills the stack takes.";
  const newGiver = slotsFree && g.kills_needed
    ? ` A mission from a faction not yet in this stack adds nothing up to ${plural(g.kills_needed, "kill")}.` : "";

  // The meaning of "+" is explained once, under the hero; the mission holding
  // a stack back is the amber row.

  return `
    <article class="stack">
      <header class="stack-head">
        <div class="stack-id">
          <h2>${esc(g.target_faction)}</h2>
          <p class="stack-meta">
            <span>${esc(g.target_type || "Ships")}</span>
            <span>${icon("pin")}${esc(g.system)}</span>
            <span class="${g.in_position ? "here-now" : ""}">${g.in_position ? "You’re here" : "Travel here"}</span>
          </p>
          <dl class="stats">${stats.map(([k, v, tip, cls]) =>
            `<div title="${esc(tip)}"><dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${v}</dd></div>`).join("")}</dl>
        </div>
        ${solo ? "" : `<div class="stack-num"><b>${cr(g.kills_needed)}${g.uncertain ? '<span class="plus">+</span>' : ""}</b><span>kills to go</span></div>`}
      </header>
      ${says.length ? `<div class="says">${says.join("")}</div>` : ""}
      ${order.map((giver) => {
        const kills = chainKills.get(giver) || 0;
        const isPace = giver === pace && g.chains.length > 1;
        // Room behind a shorter queue: more from this giver costs no extra kills.
        const free = slotsFree && !isPace ? (chainInfo.get(giver) || {}).free || 0 : 0;
        const freeWhy = `${giver}’s queue is ${plural(free, "kill")} shorter than the one that sets the pace, so another of their missions of up to ${plural(free, "kill")} adds nothing to this stack.`;
        return `
          <section class="giver">
            <div class="giver-head"><h3>${esc(giver)}${standingWord(chainInfo.get(giver))}</h3>
              <span class="giver-kills">${plural(kills, "kill")}${isPace ? `<em title="${esc(paceWhy + newGiver)}">sets the pace</em>` : ""}${
                free ? `<em title="${esc(freeWhy)}">${free} free</em>` : ""}</span></div>
            <ol class="missions">${givers.get(giver).map((m) =>
              missionRow(m, prev, segs.get(m.id), axis, headDone.get(giver) || 0,
                         risky.has(m.id) ? paceText : "")).join("")}</ol>
          </section>`;
      }).join("")}
    </article>`;
}

function renderStacks(s, prev) {
  if (!s.groups.length) {
    $("stacks").innerHTML = `
      <section class="empty">
        <h2>${s.ready.length ? "Nothing left to kill" : "No massacre missions yet"}</h2>
        <p>${s.ready.length
          ? "Every stack is finished. The missions waiting on the left pay out at their stations."
          : "Take massacre missions from a station’s mission board. They appear here within a second of accepting."}</p>
        <p>Missions from <b>different</b> factions share every kill. Missions from the <b>same</b> faction queue one after another, so spread a stack across as many factions as you can.</p>
      </section>`;
    return;
  }
  const explained = new Set();
  const solo = s.groups.length === 1;   // the hero already shows a lone stack's count
  const target = freshTarget(s);
  // Free kills only matter while there's a slot to take another mission in.
  const slotsFree = !s.slots || s.slots.used < s.slots.cap;
  $("stacks").innerHTML = s.groups.map((g) => stackCard(g, prev, solo, explained, target, slotsFree)).join("");
}

// A lock older than a quarter of an hour is history, not a target.
const freshTarget = (s) =>
  (s.target && Date.now() - new Date(s.target.at) < 15 * 60e3 ? s.target : null);

// This session as a Stocks ticker, plus the locked ship when it isn't one of
// the stacks' own (those print inside their stack).
function renderNow(s) {
  const se = s.session;
  let html = "";
  if (se) {
    const items = [
      ["This session", dur(se.hours)],
      ["Kills", cr(se.kills)],
      ["Bounties", `${cr(se.bounties_paid ?? se.bounties)} Cr`, bonusTip(se.bounties, se.bounties_paid)],
      ...(se.bonds ? [["Combat bonds", `${cr(se.bonds)} Cr`]] : []),
      ["Mission pay", se.mission_credits ? `${cr(se.mission_credits)} Cr` : "—"],
      ["Merits", se.merits ? `+${cr(se.merits)}` : "—"],
      ["Per hour", se.kills || se.mission_credits ? `${cr(se.credits_per_hour)} Cr` : "—"],
    ];
    html += `<div class="ticker">${items.map(([k, v, tip]) => `<div><span>${k}</span><b${tip || ""}>${v}</b></div>`).join("")}</div>`;
  }
  // The game's own word, on the last jump in, that you're wanted or owe a fine here.
  const lg = s.legal;
  if (lg && lg.wanted) {
    const from = lg.bounty_factions.length ? ` from ${lg.bounty_factions.map(esc).join(" and ")}` : "";
    html += `<p class="say bad" title="The game says you’re wanted in this system; the amount is what the journal logged for crimes here.">${icon("alert")}<span>You’re wanted in <b>${esc(lg.system)}</b>${
      lg.bounty ? ` — <b>${cr(lg.bounty)} Cr</b> bounty${from}` : ""}.</span></p>`;
  }
  if (lg && lg.fine) {
    const to = lg.fine_factions.length ? ` to ${lg.fine_factions.map(esc).join(" and ")}` : "";
    html += `<p class="say warn" title="The game says you have an unpaid fine in this system; the amount is what the journal logged for crimes here.">${icon("alert")}<span>Unpaid fine in <b>${esc(lg.system)}</b>${
      lg.fines ? ` — <b>${cr(lg.fines)} Cr</b>${to}` : ""}.</span></p>`;
  }
  const t = freshTarget(s);
  if (t && t.verdict !== "counts" && t.verdict !== "wrong_system") {
    const who = `${esc(t.ship)}${t.rank ? `, ${esc(t.rank)}` : ""}`;
    const text = t.verdict === "clean"
      ? `Locked: <b>${who}</b> is clean${t.faction ? ` (${esc(t.faction)})` : ""} — not a mission target, and attacking it is a crime.`
      : t.verdict === "unscanned"
        ? `Locked: <b>${who}</b> — scan it to see whether it counts.`
        : `Locked: <b>${who}</b> · ${esc(t.faction)}${t.legal ? `, ${esc(t.legal)}` : ""} — not a target for any of your stacks.`;
    html += `<p class="say ${t.verdict === "clean" ? "bad" : ""}">${icon("target")}<span>${text}</span></p>`;
  }
  $("now").innerHTML = html;
}

/* ------------------------------------------------------------------ render loop */

let lastSig = null, lastKills = null, editing = false, contact = true;
const prevP = new Map();

// Only rebuild the page when the data really changed; countdowns tick in place.
const signature = (s) => JSON.stringify(s, (k, v) =>
  (k === "generated" || k === "expires_in" || k === "last_event") ? undefined : v);

function apply(s) {
  lastState = s;
  $("cmdr").textContent = s.commander || "—";
  $("sysNow").textContent = s.current_system || "—";
  $("sysmatch").checked = s.require_system;
  $("foot").textContent = `Reading ${s.journal_file || "no journal file"} · progress is estimated from the journal`;
  if (s.slots) {
    $("slots").innerHTML = `<b>${s.slots.used}</b>/${s.slots.cap}<span class="word"> missions</span>`;
    $("slots").classList.toggle("full", s.slots.used >= s.slots.cap - 1);
  }

  const sig = signature(s);
  if (sig !== lastSig && !editing) {
    lastSig = sig;
    renderSide(s);
    renderNow(s);
    renderStacks(s, prevP);
    if (view === "journal" && lastHistory) renderJournal(lastHistory);
    prevP.clear();
    document.querySelectorAll(".mission .track i[data-p]").forEach((el) => {
      prevP.set(Number(el.closest(".mission").dataset.id), Number(el.dataset.p));
      requestAnimationFrame(() => requestAnimationFrame(() => el.style.setProperty("--p", el.dataset.p)));
    });
    if (lastKills !== null && lastKills !== s.totals.kills_needed) {
      const hero = $("heroNum");
      hero.classList.remove("tick"); void hero.offsetWidth; hero.classList.add("tick");
    }
    lastKills = s.totals.kills_needed;
  }
  tickClocks();
}

function tickClocks() {
  document.querySelectorAll(".m-due[data-expiry]").forEach((el) => {
    const u = until(el.dataset.expiry);
    el.className = `m-due ${el.dataset.risk === "1" ? "risk" : u.cls}`;
    el.lastElementChild.textContent = u.text;
  });
}

/* ------------------------------------------------------------------ journal */

let view = "stacks", lastHistory = null;

function renderJournal(h) {
  lastHistory = h;
  const t = h.totals;
  const facts = [
    ["Massacre missions", cr(t.massacres_completed)],
    ["Stacks completed", cr(t.stacks)],
    ["Kills", cr(t.kills)],
    ["Hunting time", dur(t.hunting_hours)],
    ["Usual pace", h.usual_pace ? `${h.usual_pace} kills/h` : "—"],
    ["Merits earned", cr(t.merits)],
    ["Combat bonds", t.bonds ? `${colM(t.bonds)} Cr` : "—"],
    ["Stacks run", cr(h.stacks.length)],
  ];
  const best = (s, what) => s ? `
    <div><dt>${what}<small>${esc(s.target_faction)} · ${esc(s.system)} · ${monthYear(s.start)}</small></dt>
      <dd>${what.includes("kill") ? `${cr(s.per_kill)} Cr` : `${colM(s.per_hour)} Cr/h`}</dd></div>` : "";
  const lead = (rows, label, value) => rows.length ? rows.map((r) =>
    `<div><dt>${esc(r[label])}<small>${value(r)[0]}</small></dt><dd>${value(r)[1]}</dd></div>`).join("") : "";

  $("jside").innerHTML = `
    <section class="hero">
      <p class="place">${icon("book")}Since ${monthYear(h.since)}</p>
      <p class="big">${crM(t.massacre_credits + t.bounties)}</p>
      <p class="cond">credits from massacre missions and bounties</p>
      <p class="sub">${cr(t.massacre_credits)} Cr in mission pay, ${cr(t.bounties)} Cr in bounties</p>
    </section>
    <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    ${lastState ? standingHTML(lastState.imperial, lastState.powerplay, lastState.combat) : ""}
    <section class="block"><h2>Best stacks</h2>
      <dl class="kv">${best(h.best_per_kill, "Best all-in per kill")}${best(h.best_per_hour, "Best all-in per hour")}</dl></section>
    <section class="block"><h2>Best places</h2>
      <dl class="kv">${lead(h.top_systems, "system", (p) => [plural(p.stacks, "stack"), `${colM(p.income)} Cr`])}</dl></section>
    <section class="block"><h2>Most-used providers</h2>
      <dl class="kv">${lead(h.top_providers, "name", (p) => [`${colM(p.paid)} Cr paid`, plural(p.missions, "mission")])}</dl></section>`;

  const none = '<span class="dim">—</span>';
  const stackRow = (s) => {
    const note = s.in_progress ? '<span class="live-run">in progress</span>'
      : s.open ? `<span class="lost">${s.open} never handed in</span>`
      : s.failed ? `<span class="lost">${s.failed} failed</span>` : "";
    const bonds = s.bonds ? ` · ${colM(s.bonds)} in combat bonds` : "";
    return `<li>
      <span class="name"><b>${esc(s.target_faction)}</b>
        <small>${dayMonth(s.start)} · ${esc(s.system)} · ${plural(s.missions, "mission")} from ${plural(s.providers, "provider")}${bonds}${note ? " · " + note : ""}</small></span>
      <span data-label="Kills">${cr(s.kills)}</span>
      <span data-label="Missions">${s.paid ? colM(s.paid) : none}</span>
      <span data-label="Bounties">${s.bounties ? colM(s.bounties) : none}</span>
      <span data-label="All-in / kill">${s.per_kill ? cr(s.per_kill) : none}</span>
      <span class="per-hour" data-label="All-in / hour">${s.per_hour ? colM(s.per_hour) : none}</span></li>`;
  };
  const sessionRow = (s) => `<li>
      <span class="name"><b>${new Date(s.start).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}</b>
        <small>${new Date(s.start).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}${
          s.massacres ? ` · ${plural(s.massacres, "massacre")} handed in` : ""}${
          s.bonds ? ` · ${colM(s.bonds)} in combat bonds` : ""}</small></span>
      <span data-label="Length">${dur(s.hours)}</span>
      <span data-label="Kills">${cr(s.kills)}</span>
      <span data-label="Bounties">${s.bounties ? colM(s.bounties) : none}</span>
      <span data-label="Mission pay">${s.paid ? colM(s.paid) : none}</span>
      <span data-label="Merits">${s.merits ? cr(s.merits) : none}</span></li>`;

  $("jmain").innerHTML = `
    <article class="stack">
      <header class="stack-head"><div class="stack-id"><h2>Every stack</h2>
        <p class="stack-pay">Mission pay is what was actually paid in credits; missions taken for materials or reputation pay less. Bounties are every bounty earned in the system while the stack ran. All-in adds mission pay, bounties and any combat bonds.</p></div></header>
      <div class="list-head"><span>Stack</span><span>Kills</span><span>Missions</span><span>Bounties</span><span>All-in / kill</span><span class="per-hour">All-in / hour</span></div>
      <ol class="hist">${h.stacks.map(stackRow).join("")}</ol>
    </article>
    <article class="stack sess">
      <header class="stack-head"><div class="stack-id"><h2>Hunting sessions</h2>
        <p class="stack-pay">The last ${plural(h.sessions.length, "session")} with kills or massacre hand-ins.</p></div></header>
      <div class="list-head"><span>Session</span><span>Length</span><span>Kills</span><span>Bounties</span><span>Mission pay</span><span>Merits</span></div>
      <ol class="sess">${h.sessions.map(sessionRow).join("")}</ol>
    </article>
    <p class="foot">Built from every journal file since ${monthYear(h.since)}. Hunting time and session length count the gaps between events, with any pause over 10 minutes treated as a break — a game left open isn’t time played.</p>`;
}

async function loadJournal() {
  try {
    const res = await fetch("/api/history", { cache: "no-store" });
    renderJournal(await res.json());
  } catch (err) { /* the stacks view shows lost contact */ }
}

function setView(v) {
  view = v;
  document.querySelectorAll(".segmented button").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.view === v)));
  $("stackView").hidden = v !== "stacks";
  $("journalView").hidden = v !== "journal";
  try { localStorage.setItem("view", v); } catch (err) { /* private mode */ }
  history.replaceState(null, "", v === "journal" ? "#journal" : location.pathname);
  if (v === "journal") loadJournal();
}
document.querySelectorAll(".segmented button").forEach((b) =>
  b.addEventListener("click", () => setView(b.dataset.view)));
setInterval(() => { if (view === "journal") loadJournal(); }, 30000);

function setContact(ok) {
  if (ok === contact) return;
  contact = ok;
  document.body.classList.toggle("stale", !ok);
  $("banner").hidden = ok;
  $("live").classList.toggle("lost", !ok);
  $("liveText").textContent = ok ? "Live" : "Reconnecting…";
}

async function refresh(force) {
  try {
    const res = await fetch(force ? "/api/refresh" : "/api/state", { cache: "no-store" });
    apply(await res.json());
    setContact(true);
  } catch (err) {
    setContact(false);
  }
}

/* ------------------------------------------------------------------ controls */

$("refresh").addEventListener("click", async () => {
  const btn = $("refresh");
  btn.disabled = true; btn.classList.add("busy");
  $("refreshText").textContent = "Reading…";
  await refresh(true);
  btn.classList.remove("busy");
  $("refreshIcon").innerHTML = '<use href="#i-check"/>';
  $("refreshText").textContent = "Updated";
  setTimeout(() => {
    $("refreshIcon").innerHTML = '<use href="#i-refresh"/>';
    $("refreshText").textContent = "Refresh";
    btn.disabled = false;
  }, 1200);
});

function applyWhere(on) {
  document.body.classList.toggle("hide-where", !on);
  $("showwhere").checked = on;
  try { localStorage.setItem("showWhere", on ? "1" : "0"); } catch (err) { /* private mode */ }
}
let wherePref = true;
try { wherePref = localStorage.getItem("showWhere") !== "0"; } catch (err) { /* private mode */ }
applyWhere(wherePref);
$("showwhere").addEventListener("change", (ev) => applyWhere(ev.target.checked));

$("sysmatch").addEventListener("change", async (ev) => {
  await fetch("/api/config?require_system=" + (ev.target.checked ? "1" : "0"));
  refresh();
});

// Remember which stations are expanded across re-renders.
document.addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
  d.open ? openStations.add(d.dataset.key) : openStations.delete(d.dataset.key);
}, true);

// Inline sync: type what the in-game transactions panel shows.
function closeSync() {
  document.querySelectorAll(".sync-form").forEach((f) => f.remove());
  editing = false;
}
document.addEventListener("click", async (ev) => {
  const open = ev.target.closest("[data-sync]");
  if (open) {
    closeSync();
    const li = open.closest(".mission");
    editing = true;
    const form = document.createElement("form");
    form.className = "sync-form";
    form.innerHTML = `
      <label for="syncVal">The transactions panel shows</label>
      <input id="syncVal" type="number" inputmode="numeric" min="0" max="${li.dataset.req}" value="${li.dataset.done}">
      <span>of ${li.dataset.req} kills</span>
      <button class="btn small prime" type="submit">Set</button>
      ${li.dataset.synced === "1" ? '<button class="link" type="button" data-reset>Clear correction</button>' : ""}
      <button class="link quiet" type="button" data-cancel>Cancel</button>`;
    form.dataset.id = li.dataset.id;
    li.appendChild(form);
    form.querySelector("input").select();
    return;
  }
  if (ev.target.closest("[data-cancel]")) { closeSync(); return; }
  const reset = ev.target.closest("[data-reset]");
  if (reset) {
    const id = reset.closest(".sync-form").dataset.id;
    closeSync(); lastSig = null;
    await fetch(`/api/sync?mission=${id}&reset=1`);
    refresh();
  }
});
document.addEventListener("submit", async (ev) => {
  const form = ev.target.closest(".sync-form");
  if (!form) return;
  ev.preventDefault();
  const value = form.querySelector("input").value.trim();
  const id = form.dataset.id;
  closeSync(); lastSig = null;
  if (value !== "") await fetch(`/api/sync?mission=${id}&done=${encodeURIComponent(value)}`);
  refresh();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && editing) closeSync();
});

// The welcome card: once per browser tab. The app opens a fresh tab every
// time it starts, so each launch is greeted and a reload isn't. Any click or
// key skips it; with reduced motion it simply shows and goes.
(() => {
  const el = $("welcome");
  let seen = false;
  try { seen = sessionStorage.getItem("welcomed") === "1"; sessionStorage.setItem("welcomed", "1"); } catch (err) { /* private mode */ }
  if (seen) { el.remove(); return; }
  el.hidden = false;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let gone = false;
  const leave = () => {
    if (gone) return;
    gone = true;
    removeEventListener("keydown", leave, true);
    if (calm) { el.remove(); return; }
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 600);
  };
  el.addEventListener("click", leave);
  addEventListener("keydown", leave, true);
  setTimeout(leave, calm ? 1600 : 2750);
})();

// Closing the window closes the app: say goodbye so it can stop. A reload says
// goodbye too, but asks for data again at once, so the app stays.
addEventListener("pagehide", () => {
  try { navigator.sendBeacon("/api/bye"); } catch (err) { /* nothing to tell */ }
});

// Use the pilot's own emblem if one sits beside stacker.py.
const probe = new Image();
probe.onload = () => { $("emblem").innerHTML = '<img src="/emblem" alt="">'; };
probe.src = "/emblem";

let startView = location.hash === "#journal" ? "journal" : "stacks";
try { if (!location.hash && localStorage.getItem("view") === "journal") startView = "journal"; } catch (err) { /* private mode */ }
refresh().then(() => {
  setView(startView);
  const name = $("welcomeName");
  if (name && lastState && lastState.commander) {
    name.textContent = `CMDR ${lastState.commander}`;
    // If the name arrives after its slot in the sequence, it still fades in.
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      name.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease-out" });
    }
  }
});
setInterval(refresh, 1000);
</script>
</body>
</html>
